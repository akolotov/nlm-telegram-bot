[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nlm-telegram-bot"
version = "0.1.0"
description = "Telegram bot for structured YouTube video summaries."
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.33.0",
    "python-dotenv>=1.0,<2.0",
    "python-telegram-bot[webhooks]>=22,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
"nlm-telegram-bot" = "nlm_telegram_bot.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
